services:
  # Сервис Ollama (локальная LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: logo_generator_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0

  # Наше веб-приложение для генерации логотипов
  logo_generator:
    build: .
    container_name: logo_generator_web
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434/api/chat
      - MODEL_NAME=gemma3:4b
      - LOGO_STORAGE_DIR=/app/generated_logos
    ports:
      - "8005:8005"
    volumes:
      - logo_storage:/app/generated_logos

# Тома для хранения данных
volumes:
  ollama_data:
  logo_storage: